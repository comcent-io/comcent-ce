name: Integration tests
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # .env.e2e.ci is committed and contains only dummy values scoped to the
      # throwaway CI stack — no repo secrets/vars needed, so fork PRs work too.
      - name: Add e2e env file
        run: cp .env.e2e.ci .env.e2e

      - name: Start isolated e2e stack
        run: npm run test:e2e:stack:up

      # e2e/ is not a root workspace, so its deps (incl. @playwright/test)
      # need their own install.
      - name: Install dependencies
        run: npm install && npm install --prefix e2e

      # Install browsers for e2e/'s own @playwright/test version — the root
      # install doesn't match it and tests fail with missing chromium.
      - name: Install Playwright
        run: npx --prefix e2e playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Collect stack diagnostics
        if: always()
        run: |
          mkdir -p stack-logs
          for s in server freeswitch sbc rabbitmq postgres; do
            docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e logs --no-color --tail=400 $s > stack-logs/$s.log 2>&1 || true
          done
          docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e ps > stack-logs/ps.txt 2>&1 || true
          docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e exec -T postgres \
            psql -U postgres -c "SELECT direction, count(*) FROM call_stories GROUP BY 1" \
            > stack-logs/call-stories.txt 2>&1 || true

      - name: Upload stack diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-logs
          path: stack-logs/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: npm run test:e2e:stack:down

      - name: Fail if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
