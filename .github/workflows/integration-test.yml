name: Integration tests
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workers:
        description: 'Playwright workers for this run (blank = the default in e2e/playwright.config.ts)'
        required: false
        default: ''

jobs:
  integration_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # .env.e2e.ci is committed and contains only dummy values scoped to the
      # throwaway CI stack — no repo secrets/vars needed, so fork PRs work too.
      - name: Add e2e env file
        run: cp .env.e2e.ci .env.e2e

      # `compose up` does not retry a registry error, so one reset connection
      # from a registry fails the whole run before any test starts. Do the
      # network-bound work first, with retries: pull the published images, then
      # build the local ones (their base images and package installs are
      # downloads too). `up` itself stays un-retried on purpose -- by then
      # nothing is left to download, so a failure there is a real one, such as
      # a service that never turns healthy, and retrying would hide it.
      - name: Pull and build stack images
        run: |
          compose="docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e"
          retry() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt of 4)"
              [ "$attempt" -lt 4 ] && sleep $((attempt * 15))
            done
            return 1
          }
          retry $compose pull --ignore-buildable --quiet
          retry $compose build --quiet

      - name: Start isolated e2e stack
        run: npm run test:e2e:stack:up

      # e2e/ is not a root workspace, so its deps (incl. @playwright/test)
      # need their own install.
      - name: Install dependencies
        run: npm install && npm install --prefix e2e

      # Install browsers for e2e/'s own @playwright/test version — the root
      # install doesn't match it and tests fail with missing chromium.
      - name: Install Playwright
        run: npx --prefix e2e playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        run: npm run test:e2e
        continue-on-error: true
        env:
          # Empty on a push, so the config's own default applies.
          PW_WORKERS: ${{ inputs.workers }}

      # Telephony specs are real-time: when the runner is CPU-starved they fail
      # in ways that look like product bugs. Print the evidence on every run,
      # green or red, so the Playwright worker count can be set from data.
      # FreeSWITCH prints its idle-CPU percentage on every log line; its own
      # startup lines always read ~0%, so compare the share at >= 50% idle.
      - name: Report runner load
        if: always()
        run: |
          echo "playwright workers: ${{ inputs.workers || 'config default' }}"
          echo "cores: $(nproc)   memory: $(free -g | awk '/^Mem:/{print $2}') GB   load average: $(cut -d' ' -f1-3 /proc/loadavg)"
          echo "FreeSWITCH idle CPU, by share of its log lines:"
          docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e logs freeswitch 2>/dev/null \
            | grep -oE ' [0-9]+\.[0-9]{2}% \[' | tr -d ' %[' \
            | awk '{b=int($1/10)*10; c[b]++; n++} END{for(i=0;i<=90;i+=10) if(c[i]) printf "  idle %2d-%2d%%: %5.1f%%\n", i, i+9, 100*c[i]/n}'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Collect stack diagnostics
        if: always()
        run: |
          mkdir -p stack-logs
          for s in server freeswitch sbc rabbitmq postgres; do
            docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e logs --no-color $s 2>&1 | gzip > stack-logs/$s.log.gz || true
          done
          docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e ps > stack-logs/ps.txt 2>&1 || true
          docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e exec -T rabbitmq \
            sh -c "rabbitmqctl list_queues name messages consumers; rabbitmqctl list_exchanges name type; rabbitmqctl list_bindings" \
            > stack-logs/rabbitmq-state.txt 2>&1 || true
          docker compose -f docker-compose-e2e.yaml --env-file .env.e2e -p comcent-e2e exec -T postgres \
            psql -U postgres -c "SELECT direction, count(*) FROM call_stories GROUP BY 1" \
                             -c "SELECT count(*) AS call_story_events FROM call_story_events" \
                             -c "SELECT count(*) AS call_spans FROM call_spans" \
            > stack-logs/db-counts.txt 2>&1 || true

      - name: Upload stack diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-logs
          path: stack-logs/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: npm run test:e2e:stack:down

      - name: Fail if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
