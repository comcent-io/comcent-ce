name: Publish images
# Images are published only for a main commit whose tests passed: this runs
# after "Integration tests" succeeds for a push to main, and the verify job
# also requires that commit's "Unit test" run to have passed. It publishes
# :main and the immutable :sha-<7> tags only. :latest and version tags move
# only when someone runs the Release workflow (see RELEASING.md), so a merge
# never changes what new installs get.
on:
  workflow_run:
    workflows: [Integration tests]
    types: [completed]
    branches: [main]
  # Re-publish a main commit by hand (e.g. after a registry hiccup). The
  # verify job still requires both test workflows to have passed on it.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Pick the commit
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      # Unit tests usually finish long before the integration tests; wait for
      # them (up to 30 min) if they haven't, and require success.
      - name: Require the commit's tests to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          check() { # workflow file -> conclusion of its latest run on SHA ("" while running or absent)
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "missing" elif .status == "completed" then .conclusion else "" end'
          }
          for wf in unit-test.yml integration-test.yml; do
            for _ in $(seq 1 60); do
              c=$(check "$wf")
              [ -n "$c" ] && break
              sleep 30
            done
            echo "$wf on ${SHA::7}: ${c:-still running}"
            [ "$c" = "success" ] || { echo "::error::$wf did not pass on ${SHA::7}; not publishing"; exit 1; }
          done

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: server,  dockerfile: docker/Dockerfile-server,  image: comcent-ce-server }
          - { name: web-app, dockerfile: docker/Dockerfile-web-app, image: comcent-ce-webapp }
          - { name: sbc,     dockerfile: docker/Dockerfile-sbc,     image: comcent-ce-sbc }
        platform:
          - { name: linux/amd64, runner: ubuntu-latest,    suffix: amd64 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      # The tested commit (workflow_run otherwise builds main's current head).
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same value as the image's sha- tag (see the merge job); the server
      # and web-app report it to Sentry as the release.
      - name: Set the app version
        run: echo "APP_VERSION=sha-${SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          outputs: type=image,name=ghcr.io/comcent-io/${{ matrix.service.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service.name }}-${{ matrix.platform.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [verify, build]
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: server,  image: comcent-ce-server }
          - { name: web-app, image: comcent-ce-webapp }
          - { name: sbc,     image: comcent-ce-sbc }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          IMG="ghcr.io/comcent-io/${{ matrix.service.image }}"
          SHORT_SHA="${SHA::7}"
          # No :latest here: only the Release workflow moves it.
          docker buildx imagetools create \
            -t "${IMG}:main" \
            -t "${IMG}:sha-${SHORT_SHA}" \
            $(printf "${IMG}@sha256:%s " *)
